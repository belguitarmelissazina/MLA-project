source: syn_numbers
target: svhn
data_root: ./datasets
epochs: 80
batch_size: 128
lr: 0.01
momentum: 0.9  # As per Srivastava et al., 2014 for SVHN
weight_decay: 0.0  
gamma: 15
lr_alpha: 10.0
lr_beta: 0.75
pretrained: false
experiment_name: syn_numbers_to_svhn
checkpoint_dir: ./checkpoints
results_dir: ./results
save_freq: 10
num_workers: 4
train_dann: true
train_source_only: true
seed: 42
